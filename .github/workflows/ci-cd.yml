# Yggdrasil MCP - CI and npm Publishing
# Runs tests on all pushes, publishes to npm only on version tags (v*)

name: Yggdrasil MCP CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Gitleaks & Lint-Format-Typecheck-Test-Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

  publish:
    name: Publish to npm
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 24.x
        # Deliberately NO `cache: 'pnpm'` — this job has `id-token: write` (OIDC for npm publish).
        # Restoring a shared dependency cache populated by lower-trust contexts (PR workflows
        # from forks/contributors) would let a poisoned cache entry execute install-time scripts
        # under elevated privileges, enabling OIDC-token theft and malicious npm publish.
        # Trade-off: ~30s slower install on each tag push. Worth it.
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        # --ignore-scripts: defense in depth against malicious lifecycle scripts even if the
        # pnpm registry tarballs themselves are compromised. We don't need any dep's postinstall
        # behaviour to publish the package.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build package
        run: pnpm build

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) ≠ package.json ($PACKAGE_VERSION)"
            exit 1
          fi
          echo "✅ Tag v${TAG_VERSION} matches package.json"

      - name: Publish to npm (OIDC + SLSA provenance)
        # Authenticates via OIDC (Trusted Publisher configured on npmjs.org for this repo + workflow);
        # no NODE_AUTH_TOKEN secret needed. --provenance produces a Sigstore-signed SLSA build
        # attestation visible as the "Verified" badge on the npmjs.org package page.
        # Pre-release versions (containing "-", e.g. "1.2.1-rc.0") publish under the "next"
        # dist-tag so they don't replace "latest" for `npm install yggdrasil-mcp` consumers.
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            echo "Pre-release detected: publishing v${VERSION} with --tag next"
            npm publish --access public --provenance --tag next
          else
            echo "Stable release: publishing v${VERSION} with default --tag latest"
            npm publish --access public --provenance
          fi

  release-mcpb:
    name: Build & Release Claude Desktop Extension (.mcpb)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write   # Attach .mcpb to GitHub Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 24.x
        # Deliberately NO `cache: 'pnpm'` — same rationale as publish job: this job has
        # `contents: write` (uploads to GitHub Release + R2). Shared dep cache poisoned by a
        # lower-trust PR workflow could execute install-time scripts under elevated privileges.
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate source manifest
        run: pnpm validate:mcpb

      - name: Build .mcpb bundle
        run: pnpm build:mcpb

      - name: Build Cowork/Code plugin
        run: pnpm build:cowork-plugin

      - name: Verify .mcpb version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          FILE="$(ls dist-mcpb/yggdrasil-mcp-*.mcpb)"
          EXPECTED="dist-mcpb/yggdrasil-mcp-${TAG_VERSION}.mcpb"
          if [ "$FILE" != "$EXPECTED" ]; then
            echo "❌ Built .mcpb $FILE does not match tag-derived path $EXPECTED"
            exit 1
          fi
          echo "✅ Built $FILE matches tag v${TAG_VERSION}"

      - name: Aggregate SHA256SUMS + generate latest-pointer sidecars
        # Reuses the per-artefact .sha256 sidecars produced by build-mcpb.sh / build-cowork-plugin.sh
        # — no re-hashing. The latest-pointer rewrite is load-bearing: without it,
        # `shasum -a 256 -c yggdrasil-mcp-latest.mcpb.sha256` fails because the versioned sidecar
        # references yggdrasil-mcp-<version>.mcpb, not the file the user downloaded.
        run: |
          set -euo pipefail
          MCPB_SIDECAR="$(ls dist-mcpb/yggdrasil-mcp-*.mcpb.sha256)"
          ZIP_SIDECAR="$(ls dist-cowork/yggdrasil-mcp-*.zip.sha256)"
          MCPB_SHA="$(awk '{print $1}' "$MCPB_SIDECAR")"
          ZIP_SHA="$(awk '{print $1}' "$ZIP_SIDECAR")"

          # Aggregate SHA256SUMS — concat sidecars with path-prefixed filenames
          { awk -v p="dist-mcpb/"   '{print $1"  "p$2}' "$MCPB_SIDECAR"
            awk -v p="dist-cowork/" '{print $1"  "p$2}' "$ZIP_SIDECAR"; } > SHA256SUMS

          # Latest-pointer sidecars with correct filename inside body
          printf '%s  yggdrasil-mcp-latest.mcpb\n' "$MCPB_SHA" > dist-mcpb/yggdrasil-mcp-latest.mcpb.sha256
          printf '%s  yggdrasil-mcp-latest.zip\n'  "$ZIP_SHA"  > dist-cowork/yggdrasil-mcp-latest.zip.sha256

          echo "─── SHA256SUMS (aggregate) ───"
          cat SHA256SUMS
          echo "─── latest sidecars ───"
          cat dist-mcpb/yggdrasil-mcp-latest.mcpb.sha256
          cat dist-cowork/yggdrasil-mcp-latest.zip.sha256

      - name: Attach .mcpb + .zip + SHA256SUMS to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist-mcpb/*.mcpb
            dist-mcpb/*.sha256
            dist-cowork/*.zip
            dist-cowork/*.sha256
            SHA256SUMS
          generate_release_notes: true

      - name: Configure AWS CLI for Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials <<EOF
          [default]
          aws_access_key_id=${AWS_ACCESS_KEY_ID}
          aws_secret_access_key=${AWS_SECRET_ACCESS_KEY}
          EOF
          cat > ~/.aws/config <<EOF
          [default]
          region=auto
          EOF

      - name: Upload .mcpb + .zip + checksums to R2 (versioned + latest)
        env:
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          MCPB_BASE="yggdrasil-mcp-${TAG_VERSION}.mcpb"
          ZIP_BASE="yggdrasil-mcp-${TAG_VERSION}.zip"
          MCPB_FILE="dist-mcpb/${MCPB_BASE}"
          ZIP_FILE="dist-cowork/${ZIP_BASE}"
          IMMUTABLE="public, max-age=31536000, immutable"
          LATEST="public, max-age=300"
          [ -f "$MCPB_FILE" ] || { echo "missing $MCPB_FILE"; exit 1; }
          [ -f "$ZIP_FILE"  ] || { echo "missing $ZIP_FILE";  exit 1; }

          r2_put() {
            # $1=local path, $2=R2 key, $3=content-type, $4=cache-control
            aws s3 cp "$1" "s3://packages/yggdrasil-mcp/$2" \
              --endpoint-url "$R2_ENDPOINT" --content-type "$3" --cache-control "$4"
          }

          r2_put "$MCPB_FILE"                                          "${MCPB_BASE}"                          application/zip "$IMMUTABLE"
          r2_put "dist-mcpb/${MCPB_BASE}.sha256"                       "${MCPB_BASE}.sha256"                   text/plain      "$IMMUTABLE"
          r2_put "$MCPB_FILE"                                          "yggdrasil-mcp-latest.mcpb"             application/zip "$LATEST"
          r2_put "dist-mcpb/yggdrasil-mcp-latest.mcpb.sha256"          "yggdrasil-mcp-latest.mcpb.sha256"      text/plain      "$LATEST"

          r2_put "$ZIP_FILE"                                           "${ZIP_BASE}"                           application/zip "$IMMUTABLE"
          r2_put "dist-cowork/${ZIP_BASE}.sha256"                      "${ZIP_BASE}.sha256"                    text/plain      "$IMMUTABLE"
          r2_put "$ZIP_FILE"                                           "yggdrasil-mcp-latest.zip"              application/zip "$LATEST"
          r2_put "dist-cowork/yggdrasil-mcp-latest.zip.sha256"         "yggdrasil-mcp-latest.zip.sha256"       text/plain      "$LATEST"

          r2_put "SHA256SUMS"                                          "SHA256SUMS"                            text/plain      "$LATEST"

          echo "✅ Uploaded to R2:"
          echo "   https://packages.henrychong.com/yggdrasil-mcp/${MCPB_BASE}"
          echo "   https://packages.henrychong.com/yggdrasil-mcp/yggdrasil-mcp-latest.mcpb"
          echo "   https://packages.henrychong.com/yggdrasil-mcp/${ZIP_BASE}"
          echo "   https://packages.henrychong.com/yggdrasil-mcp/yggdrasil-mcp-latest.zip"
