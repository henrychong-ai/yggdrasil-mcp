# Yggdrasil MCP - CI and npm Publishing
# Runs tests on all pushes, publishes to npm only on version tags (v*)

name: Yggdrasil MCP CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Gitleaks & Lint-Format-Typecheck-Test-Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

  publish:
    name: Publish to npm
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          npm install

      - name: Build package
        run: npm run build

      - name: Set executable permissions
        run: chmod +x dist/*.js

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "Tag version: $TAG_VERSION"

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Package.json version: $PACKAGE_VERSION"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "❌ Error: Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi
          echo "✅ Tag version matches package.json version"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-mcpb:
    name: Build & Release Claude Desktop Extension (.mcpb)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write   # Attach .mcpb to GitHub Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source manifest
        run: pnpm validate:mcpb

      - name: Build .mcpb bundle
        run: pnpm build:mcpb

      - name: Build Cowork/Code plugin
        run: pnpm build:cowork-plugin

      - name: Verify .mcpb version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          FILE="$(ls dist-mcpb/yggdrasil-mcp-*.mcpb)"
          EXPECTED="dist-mcpb/yggdrasil-mcp-${TAG_VERSION}.mcpb"
          if [ "$FILE" != "$EXPECTED" ]; then
            echo "❌ Built .mcpb $FILE does not match tag-derived path $EXPECTED"
            exit 1
          fi
          echo "✅ Built $FILE matches tag v${TAG_VERSION}"

      - name: Aggregate SHA256SUMS
        run: |
          # Combined SHA256SUMS across both artefact directories
          shasum -a 256 dist-mcpb/*.mcpb dist-cowork/*.zip > SHA256SUMS
          # Per-dir copies for backwards-compat
          shasum -a 256 dist-mcpb/*.mcpb | awk '{ sub(/^dist-mcpb\//, "", $2); print }' > dist-mcpb/SHA256SUMS
          shasum -a 256 dist-cowork/*.zip | awk '{ sub(/^dist-cowork\//, "", $2); print }' > dist-cowork/SHA256SUMS
          echo "─── SHA256SUMS ───"
          cat SHA256SUMS

      - name: Attach .mcpb + .zip + SHA256SUMS to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-mcpb/*.mcpb
            dist-mcpb/*.sha256
            dist-cowork/*.zip
            dist-cowork/*.sha256
            SHA256SUMS
          generate_release_notes: true

      - name: Configure AWS CLI for Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials <<EOF
          [default]
          aws_access_key_id=${AWS_ACCESS_KEY_ID}
          aws_secret_access_key=${AWS_SECRET_ACCESS_KEY}
          EOF
          cat > ~/.aws/config <<EOF
          [default]
          region=auto
          EOF

      - name: Upload .mcpb + .zip + checksums to R2 (versioned + latest)
        env:
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          MCPB_FILE="$(ls dist-mcpb/yggdrasil-mcp-*.mcpb)"
          MCPB_BASE="$(basename "$MCPB_FILE")"
          ZIP_FILE="$(ls dist-cowork/yggdrasil-mcp-*.zip)"
          ZIP_BASE="$(basename "$ZIP_FILE")"
          IMMUTABLE="public, max-age=31536000, immutable"
          LATEST="public, max-age=300"

          # === .mcpb (Claude Desktop) ===
          aws s3 cp "$MCPB_FILE" "s3://packages/yggdrasil-mcp/${MCPB_BASE}" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/zip --cache-control "$IMMUTABLE"
          aws s3 cp "dist-mcpb/${MCPB_BASE}.sha256" "s3://packages/yggdrasil-mcp/${MCPB_BASE}.sha256" \
            --endpoint-url "$R2_ENDPOINT" --content-type text/plain --cache-control "$IMMUTABLE"
          aws s3 cp "$MCPB_FILE" "s3://packages/yggdrasil-mcp/yggdrasil-mcp-latest.mcpb" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/zip --cache-control "$LATEST"
          aws s3 cp "dist-mcpb/${MCPB_BASE}.sha256" "s3://packages/yggdrasil-mcp/yggdrasil-mcp-latest.mcpb.sha256" \
            --endpoint-url "$R2_ENDPOINT" --content-type text/plain --cache-control "$LATEST"

          # === .zip (Cowork/Code plugin) ===
          aws s3 cp "$ZIP_FILE" "s3://packages/yggdrasil-mcp/${ZIP_BASE}" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/zip --cache-control "$IMMUTABLE"
          aws s3 cp "dist-cowork/${ZIP_BASE}.sha256" "s3://packages/yggdrasil-mcp/${ZIP_BASE}.sha256" \
            --endpoint-url "$R2_ENDPOINT" --content-type text/plain --cache-control "$IMMUTABLE"
          aws s3 cp "$ZIP_FILE" "s3://packages/yggdrasil-mcp/yggdrasil-mcp-latest.zip" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/zip --cache-control "$LATEST"
          aws s3 cp "dist-cowork/${ZIP_BASE}.sha256" "s3://packages/yggdrasil-mcp/yggdrasil-mcp-latest.zip.sha256" \
            --endpoint-url "$R2_ENDPOINT" --content-type text/plain --cache-control "$LATEST"

          # === Combined SHA256SUMS ===
          aws s3 cp "SHA256SUMS" "s3://packages/yggdrasil-mcp/SHA256SUMS" \
            --endpoint-url "$R2_ENDPOINT" --content-type text/plain --cache-control "$LATEST"

          echo "✅ Uploaded to R2:"
          echo "   https://packages.henrychong.com/yggdrasil-mcp/${MCPB_BASE}"
          echo "   https://packages.henrychong.com/yggdrasil-mcp/yggdrasil-mcp-latest.mcpb"
          echo "   https://packages.henrychong.com/yggdrasil-mcp/${ZIP_BASE}"
          echo "   https://packages.henrychong.com/yggdrasil-mcp/yggdrasil-mcp-latest.zip"
